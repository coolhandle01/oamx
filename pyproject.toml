[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oamx"
version = "0.1.0"
description = "Read the OWASP Amass asset database and pipe it into everything else"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["amass", "osint", "recon", "attack-surface", "bug-bounty", "open-asset-model"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

# No runtime dependencies. This is deliberate: it is a recon-pipeline tool,
# and a recon pipeline that breaks on a transitive dependency resolution is
# worse than no tool at all.
dependencies = []

[project.optional-dependencies]
# Development only. None of this is imported by oamx at runtime - the
# zero-dependency promise above is about what an installed oamx pulls in, and
# the `no-deps` CI job proves it independently of anything listed here.
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.11",
    "pylint>=3.2",
    # Pinned exactly: a floating linter turns a new upstream rule into a red
    # main, which is not a signal about this repository.
    "ruff==0.16.0",
]

[project.scripts]
oamx = "oamx.cli:main"

[project.urls]
Homepage = "https://github.com/coolhandle01/oamx"
Issues = "https://github.com/coolhandle01/oamx/issues"

[tool.setuptools.packages.find]
include = ["oamx*"]

# Ship the typing marker so importers get oamx's annotations instead of Any.
# The package is mypy --strict clean; without this, none of that reaches a
# consumer.
[tool.setuptools.package-data]
oamx = ["py.typed"]

# Commit messages are Conventional Commits and CI checks them. `cz bump` also
# keeps oamx/__init__.py's __version__ in step with [project].version, which
# are otherwise two places declaring the same number.
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_files = ["oamx/__init__.py:__version__"]
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = true
annotated_tag = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage flags are deliberately NOT in addopts. The sdist ships this suite so
# a downstream packager can verify the build they are shipping, and a packager
# has pytest but no reason to have pytest-cov - addopts would hand them an
# argparse error instead of a test run, which is worse than shipping nothing.
# The gate lives in the invocation instead: see CONTRIBUTING and tests.yml.

[tool.coverage.run]
branch = true
source = ["oamx"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["oamx"]

[tool.pylint.main]
# Ratchet, not an aspiration. Set just under the score the tree scores today,
# so it catches regression rather than demanding an immediate refactor.
fail-under = 9.9
py-version = "3.10"

[tool.pylint.format]
max-line-length = 100
# reader.py is ~500 lines. This flags a module that is getting away from us
# without demanding one be split today.
max-module-lines = 600

[tool.pylint.design]
# Likewise sized against the current shape plus headroom. AssetDB legitimately
# carries one attribute per introspected table and column, and `edges()` is the
# widest function in the tree; both are noted in CONTRIBUTING as the two places
# that would most benefit from decomposition.
max-args = 12
max-positional-arguments = 12
max-locals = 25
max-attributes = 22
max-branches = 15
max-statements = 60
max-public-methods = 25
max-returns = 8

[tool.pylint."messages control"]
disable = [
    # Ruff owns style; pylint is here for the design and length checks.
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "superfluous-parens",
    "too-few-public-methods",
    # Deliberate and documented at each site: optional extras are imported
    # lazily, and model/reader break their cycle with a function-local import.
    "import-outside-toplevel",
    "cyclic-import",
    # Known wart, tracked rather than silenced everywhere: select.build reaches
    # into AssetDB._load_sources. Promote it to a public method to fix properly.
    "protected-access",
]
