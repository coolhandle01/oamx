name: meta

# Checks on the repository itself rather than on oamx. The tool's own suite
# lives in tests.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Every tool version comes from the `dev` extra in pyproject, so what CI runs
  # and what CONTRIBUTING tells you to run cannot drift apart.
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # `ruff format` is not enforced. The source is hand-wrapped - aligned
      # argparse calls, deliberate string continuations - and the formatter
      # would rewrite ten files to no benefit. Revisit as its own change if
      # ever, never as a drive-by.

  types:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The floor, not the newest: strict mode against 3.10 is what
          # `python_version` in [tool.mypy] pins, and a newer interpreter would
          # quietly accept syntax the floor rejects.
          python-version: "3.10"
      - run: pip install -e ".[dev]"
      - run: mypy

  design:
    name: pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Scoped to design and length checks and gated on a score; ruff owns
      # style. See [tool.pylint] for what is enabled and why.
      - run: pylint oamx

  hooks:
    name: hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # shellcheck and jq are both preinstalled on ubuntu runners, which keeps
      # this job dependency-free like the rest of the repo.
      - name: shellcheck
        run: shellcheck .claude/hooks/*.sh
      - name: behaviour tests
        run: .claude/hooks/test-hooks.sh

  commits:
    name: commit messages
    runs-on: ubuntu-latest
    # Only meaningful on a pull request, where there is a base to diff against.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          # cz needs the real history to walk the range, not a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pipx install commitizen
      - name: conventional commits
        run: >
          cz check --rev-range
          ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
