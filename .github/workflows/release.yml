name: release

# Fires only on a version tag, which bumpversion.yml creates automatically when a
# merge to main warrants a release. Nothing here runs on a normal push or pull
# request, so an accidental publish is not reachable from ordinary development.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A release runs the full PR gate first, by calling the very same reusable
  # workflows a pull request runs - not a copy of them. If ruff, mypy, pylint,
  # the hook tests, the 3.10-3.13 test matrix, the no-dependencies check, or
  # CodeQL would fail on a PR, the release stops here, before build.
  #
  # Left unnamed on purpose: a called workflow's checks are prefixed with the
  # calling job's name, so each one already answers to two names - `ruff` on a
  # pull request, `checks / ruff` on a tag. Naming these for the caller's
  # context ("pr checks", say) makes the tag copy claim to be a PR check, and
  # that copy is what the required-status-check picker offers, since it lists
  # whatever ran most recently.
  checks:
    uses: ./.github/workflows/analysers.yml

  tests:
    uses: ./.github/workflows/tests.yml

  # CodeQL against the exact tag being published. This is the "release happens
  # last" guarantee: on an ordinary merge the scan runs in parallel with the
  # bump, so a tag could otherwise be published before its results landed. The
  # caller job grants security-events:write, which the called workflow inherits
  # (reusable-workflow permissions downgrade only, so this is the ceiling).
  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  build:
    name: build
    needs: [checks, tests, codeql]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - run: pipx run build
      # Refuse to ship metadata PyPI would reject, before anything is uploaded.
      - run: pipx run twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist
          path: dist/

  smoke:
    name: smoke test the wheel
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/
      # The suite runs from a source checkout; this proves the *built artefact*
      # installs and that both entry points are wired up. They are separate
      # paths - the console script goes through [project.scripts] to
      # oamx.cli:main, `python -m` through oamx/__main__.py - so a wheel can
      # ship one working and the other broken.
      - run: pip install dist/*.whl
      - run: oamx --version
      - name: both entry points agree
        run: |
          script=$(oamx --version)
          module=$(python -m oamx --version)
          echo "console script: $script"
          echo "python -m     : $module"
          [ "$script" = "$module" ] || { echo "entry points disagree"; exit 1; }
      - name: a missing database is a clean error, not a traceback
        run: |
          set +e
          out=$(oamx names --db /nonexistent.sqlite 2>&1)
          rc=$?
          set -e
          echo "$out"
          [ "$rc" = "1" ] || { echo "expected exit 1, got $rc"; exit 1; }
          case "$out" in *"no such database"*) ;; *) echo "unexpected message"; exit 1 ;; esac

  publish:
    name: publish to PyPI
    needs: smoke
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's OIDC identity, so
      # there is no long-lived API token stored in the repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1

  github-release:
    name: github release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/*
          --title "${{ github.ref_name }}"
          --generate-notes
